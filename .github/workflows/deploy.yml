name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions for deploying to GitHub Pages, canceling legacy jobs, and branch fallback
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages build source is GitHub Actions
        run: |
          response=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Pages API response ($http_code): $body"
          if [ "$http_code" = "204" ] || [ "$http_code" = "200" ]; then
            echo "Successfully updated GitHub Pages build_type to workflow."
          else
            echo "Pages API returned $http_code. If required, select GitHub Actions in Settings > Pages."
          fi

      - name: Cancel conflicting legacy pages-build-deployment runs
        run: |
          runs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}")
          for run_id in $(echo "$runs" | jq -r '.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "in_progress" or .status == "queued")) | .id'); do
            echo "Canceling conflicting legacy workflow run $run_id..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/cancel"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: /Software-Architecture-Drift-Detector/
        run: npm run build

      - name: Verify build artifacts and index.html
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "::error::Build verification failed: frontend/dist/index.html is missing!"
            exit 1
          fi
          echo "Build verification passed: frontend/dist/index.html exists."
          echo "Index.html contents:"
          head -n 25 frontend/dist/index.html
          echo "Listing all generated assets:"
          ls -la frontend/dist
          ls -la frontend/dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to gh-pages branch (fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any legacy runs to finish canceling
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
