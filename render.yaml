databases:
  - name: drift-detector-db
    databaseName: drift_detector
    user: drift_user
    plan: free

services:
  - type: web
    name: software-architecture-drift-detector
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drift-detector-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://tamilselvan3660.github.io
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: "pirajan20012009@gmail.com"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
